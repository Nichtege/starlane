/* See-through of the widgets (the slider in the widget menu): glassApply() puts --lg-a, --lg-blur, --lg-sat, --lg-rim, --lg-sheen and
   --hs-shade on the grid. At the matte end a pane has no backdrop filter at all; near the liquid end text gets a soft shadow. */
.hs-grid .widget { text-shadow: 0 1px 3px rgba(0, 0, 0, var(--hs-shade, 0)); }
html:root body .hs-grid.hs-matte :is(.card, .kpi, .deadline, .hero) { -webkit-backdrop-filter: none; backdrop-filter: none; }
/* Liquid glass of the panes (createGlassPass): the canvas under a pane is the glass, bent at its edge by the graphics card. The pane keeps
   tint, border and text; its own blur is dropped (that is the cost the pass saves) and the lit edge is the pass's. */
html:root body .hs-grid.hs-glx :is(.card, .kpi, .deadline, .hero) { -webkit-backdrop-filter: none; backdrop-filter: none; --lg-rim: transparent; }
html:root body .hs-grid :is(.card, .kpi, .hero) .deadline { -webkit-backdrop-filter: none; backdrop-filter: none; }   /* a pane inside a pane: its backdrop is that pane */
html:root body .w-pop { max-height: min(680px, calc(100vh - 150px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.w-pop-h { padding: 12px 16px 4px; font: 600 13px var(--font); color: var(--ink-2); }
.w-glass { display: grid; gap: 6px; padding: 10px 16px 12px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
.w-glass-h { display: flex; align-items: baseline; gap: 10px; font: 600 13px var(--font); color: var(--ink-2); }
.w-glass-h label { flex: 1 1 auto; }
.w-glass-v { color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.w-glass-reset { padding: 0; border: 0; background: none; cursor: pointer; font: 600 13px var(--font); color: var(--accent-ink); }
.w-glass-reset[hidden] { display: none; }
.w-glass-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.w-glass-note { margin: 0; }
.hs-glass-mini { display: inline-flex; align-items: center; gap: 8px; margin-right: 6px; padding: 0 6px; font: 500 12px var(--font); color: var(--ink-2); }
.hs-glass-mini .hs-glass-range { width: 120px; }
@media (max-width: 760px) { .hs-glass-mini { display: none; } }
/* Slider (iOS 27): a 6 px track, filled in the tint up to the knob, and a white 38 x 24 capsule that swells while it is held.
   --f (0..1) is the position, set by rangeFill() in the script: Chromium cannot style the filled part on its own. */
:is(.hs-glass-range, .os-range) { --f: .5; -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
:is(.hs-glass-range, .os-range)::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0 calc(19px + (100% - 38px) * var(--f)), var(--fill-1) 0); }
:is(.hs-glass-range, .os-range)::-moz-range-track { height: 6px; border-radius: 3px; background: var(--fill-1); }
:is(.hs-glass-range, .os-range)::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
:is(.hs-glass-range, .os-range)::-webkit-slider-thumb { -webkit-appearance: none; width: 38px; height: 24px; margin-top: -9px; border: 0; border-radius: 999px; background: #fff;
  box-shadow: 0 6px 13px rgba(0,0,0,.12), 0 .5px 4px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); transition: scale .3s var(--lg-spring); }
:is(.hs-glass-range, .os-range)::-moz-range-thumb { width: 38px; height: 24px; border: 0; border-radius: 999px; background: #fff;
  box-shadow: 0 6px 13px rgba(0,0,0,.12), 0 .5px 4px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
:is(.hs-glass-range, .os-range):active::-webkit-slider-thumb { scale: 1.12 1.2; }
:is(.hs-glass-range, .os-range):focus-visible { outline: none; }
:is(.hs-glass-range, .os-range):focus-visible::-webkit-slider-thumb { box-shadow: 0 6px 13px rgba(0,0,0,.12), 0 0 0 3px var(--focus); }
:is(.hs-glass-range, .os-range):focus-visible::-moz-range-thumb { box-shadow: 0 6px 13px rgba(0,0,0,.12), 0 0 0 3px var(--focus); }
:is(.hs-glass-range, .os-range):disabled { opacity: .45; cursor: not-allowed; }

/* Switch (iOS 27): every on/off checkbox is a switch (role="switch"), 64 x 28, green when on, the knob a white 38 x 24 capsule
   that stretches while it is pressed. Forced colours get the native checkbox back (rule in the base section). */
input[type="checkbox"][role="switch"] { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 64px; height: 28px; margin: 0;
  border-radius: 999px; cursor: pointer; background: var(--switch-off); transition: background .25s var(--ease); }
input[type="checkbox"][role="switch"]::before { content: ""; position: absolute; left: 2px; top: 2px; width: 38px; height: 24px; border-radius: 999px; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: translate .35s var(--lg-spring), width .2s var(--ease); }
input[type="checkbox"][role="switch"]:checked { background: var(--green); }
input[type="checkbox"][role="switch"]:checked::before { translate: 22px 0; }
input[type="checkbox"][role="switch"]:active::before { width: 44px; }
input[type="checkbox"][role="switch"]:checked:active::before { translate: 16px 0; }
input[type="checkbox"][role="switch"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type="checkbox"][role="switch"]:disabled { opacity: .5; cursor: not-allowed; }
@media (prefers-contrast: more) {   /* Settings > Accessibility > On/Off Labels: a bar when on, a ring when off */
  input[type="checkbox"][role="switch"] { background: rgba(60,60,67,.6); }
  input[type="checkbox"][role="switch"]:checked { background: #248a3d; }
  input[type="checkbox"][role="switch"]::after { content: ""; position: absolute; top: 9px; right: 14px; width: 10px; height: 10px; border: 1.5px solid #fff; border-radius: 50%; box-sizing: border-box; }
  input[type="checkbox"][role="switch"]:checked::after { left: 14px; right: auto; width: 1.5px; border: 0; background: #fff; border-radius: 1px; }
}

/* Tint: the accent colour, picked in the Customise menu (html[data-tint], see section 1) */
.w-tints { display: grid; grid-template-columns: repeat(9, minmax(0, 28px)); justify-content: space-between; gap: 6px; padding: 6px 16px 12px; }   /* all nine on one row */
.w-tint { width: 100%; height: auto; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; cursor: pointer; background: var(--sw); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.w-tint[aria-checked="true"] { outline: 2px solid var(--sw); outline-offset: 2px; }
.w-tint:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.w-tint[data-tint="blue"] { --sw: #0088ff; } .w-tint[data-tint="purple"] { --sw: #cb30e0; } .w-tint[data-tint="pink"] { --sw: #ff2d55; }
.w-tint[data-tint="red"] { --sw: #ff383c; } .w-tint[data-tint="orange"] { --sw: #ff8d28; } .w-tint[data-tint="yellow"] { --sw: #ffcc00; }
.w-tint[data-tint="green"] { --sw: #34c759; } .w-tint[data-tint="indigo"] { --sw: #6155f5; } .w-tint[data-tint="graphite"] { --sw: #8e8e93; }
/* The way into the Appearance sheet, first in the Customise menu */
.w-look { width: 100%; border: 0; background: none; color: var(--ink); text-align: left; font: inherit; margin-bottom: 2px; }
.w-look svg { color: var(--muted); }
.w-look-t { display: grid; padding: 6px 0; line-height: 1.25; }
.w-look-t small { font-size: 12px; color: var(--muted); }

/* Appearance (openLookSheet): a floating pane like the inspector; a sheet from the bottom on a phone */
.look { position: fixed; z-index: 55; top: 12px; right: 12px; bottom: 12px; width: min(388px, calc(100vw - 24px)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  color: var(--ink); background: var(--glass-2); border-radius: 34px; box-shadow: var(--shadow-lg); animation: slideIn .5s var(--ease); }
.look:focus { outline: none; }
.look-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 6px 24px; }
.look-h h2 { margin: 0; font: var(--t-title3); }
.look-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 0 16px 6px; }
.look-sec { padding: 12px 8px 16px; border-top: 1px solid var(--line); }
.look-sec:first-child { border-top: 0; }
.look-sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; font: 600 15px/20px var(--font); }
.look-std { padding: 0; border: 0; background: none; cursor: pointer; font: 600 13px var(--font); color: var(--accent-ink); }
.look-std:disabled { color: var(--label-3); cursor: default; }
.look-forms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.look-form { display: grid; align-content: start; justify-items: center; gap: 4px; min-width: 0; padding: 4px 4px 7px; border: 0; border-radius: 18px; background: var(--fill-4); color: var(--ink); cursor: pointer; font: 600 12px/15px var(--font); }
.look-form canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 14px; }
.look-form small { font-weight: 400; color: var(--muted); }
.look-form span { max-width: 100%; text-align: center; }
.look-form:hover { background: var(--fill-3); }
.look-form[aria-checked="true"] { box-shadow: 0 0 0 2px var(--accent); }
.look-gh { grid-column: 1 / -1; margin: 8px 2px 0; font: 600 12px/16px var(--font); color: var(--muted); }
.look-gh:first-child { margin-top: 0; }
.look-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.look-preset { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 5px; border: 0; border-radius: 999px; background: var(--fill-3); color: var(--ink); cursor: pointer; font: 500 13px var(--font); }
.look-preset i { width: 22px; height: 22px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.3); }
.look-preset:hover { background: var(--fill-2); }
.look-preset[aria-checked="true"] { background: var(--accent-btn); color: var(--on-accent); }
.look-wells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
.look-well { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; cursor: pointer; transition: opacity .2s; }
.look-well span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.look-well input { flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.look-well input::-webkit-color-swatch-wrapper { padding: 0; }
.look-well input::-webkit-color-swatch { border: 0; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35), 0 0 0 .5px rgba(0,0,0,.35); }
.look-well input::-moz-color-swatch { border: 0; border-radius: 50%; }
.look-well.is-unused { opacity: .4; }
.look-note { margin: 10px 0 0; font-size: 12px; color: var(--warn-ink); }
.look-sub { margin: -4px 0 12px; font-size: 12px; color: var(--ink-2); }
.look .w-tints { padding: 0 0 14px; }
.look-segs { margin: 0 0 12px; }
.look-icons { display: flex; justify-content: space-between; gap: 6px; margin: 0 0 14px; padding: 10px 12px; border-radius: 18px; background: var(--fill-4); }
.look-icons .app-ico { width: 34px; height: 34px; }
.look-f { padding: 10px 24px 18px; border-top: 1px solid var(--line); }
.look-f .btn { width: 100%; justify-content: center; }
@media (max-width: 720px) {
  .look { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 78vh; animation-name: slideUp; }
  .look-form { font-size: 11px; } .look-form small { display: none; }
}

/* =====================================================================
   Liquid glass: rounded panes that float over deep space.
   Last on purpose. The material of iOS 27: a frosted, saturated pane with a lit edge, a hairline and a soft drop
   (frost 16 px, refraction .7, dispersion .2, light fill white at 70 %, dark #1a1a1a at 70 to 90 %, shadow 0 8 48).
   Glass is the navigation layer: the tab bar, the toolbar buttons, menus, sheets and popovers on every tab, plus the widgets
   that float over the galaxy (home, Second brain, Atlas). The cards of a page tab are solid grouped surfaces (base section).
   Three steps, set on <html data-glass> by the script (LG): flat, frost, lens.
   Vocabulary of callstack/liquid-glass, as far as it applies here: every pane and control is "regular" glass, "none" is the Flat
   step, "interactive" is the pointer highlight (--mx/--my) and the press, --lg-over is the tint of one pane (deadlines, notes),
   a container is one pane whose children are drawn flat inside it. No piece uses "clear".
   --wc is the colour of one widget: the title of a widget is set in it, as on the iOS home screen.
   Everything that moves sits inside "no-preference" at the end of this block.
   ===================================================================== */
:root {
  --lg-r: 28px; --lg-r-m: 22px; --lg-r-s: 12px; --lg-gap: 16px; --lg-r-menu: 34px; --lg-r-sheet: 38px;   /* widget, small pane, inset; menu, sheet */
  --lg-spring: cubic-bezier(.34, 1.45, .64, 1);   /* overshoots a little: glass settles like a drop */
  --lg-blur: 16px; --lg-sat: 1.8;
  --lg-a: 72%; --lg-a-pop: 84%; --lg-a-ctl: 64%;       /* how much of the surface colour a pane, a popup and a control keep */
  --lg-rim: rgba(255,255,255,.95); --lg-sheen: .3;      /* lit edge on top, strength of the sheen */
  --lg-hair: rgba(0,0,0,.09); --lg-drop: rgba(0,0,0,.16);   /* the hairline round a piece of glass and its drop shadow */
}
html[data-glass="flat"] body, html[data-glass="flat"] body.is-home, html[data-glass="flat"] body.is-brain, html[data-glass="flat"] body.is-atlas {
  --lg-a: 94%; --lg-a-pop: 97%; --lg-a-ctl: 90%; --lg-sheen: .06;
}
html[data-glass="flat"] *, html[data-glass="flat"] *::before, html[data-glass="flat"] *::after { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
@media (prefers-reduced-transparency: reduce) {
  html:not([data-glass]) body { --lg-a: 94%; --lg-a-pop: 97%; --lg-a-ctl: 90%; }
  html:not([data-glass]) * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html:root body { --lg-a: 92%; --lg-a-pop: 96%; --lg-a-ctl: 88%; }
}

/* Colour of a widget (the :where keeps the specific rules below stronger) */
:where(.card, .kpi, .deadline, .stage, .hero) { --wc: var(--accent); }
.widget[data-wid="calendar"], .widget[data-wid="clocks"], .widget[data-wid="apps"], .widget[data-wid="launch"], .widget[data-wid="recent"] { --wc: var(--cyan); }
.widget[data-wid="deadlines"], .widget[data-wid="artifacts"] { --wc: var(--pink); }
.widget[data-wid="upcoming"], .widget[data-wid="routines"], .widget[data-wid="runs"], .widget[data-wid="health"] { --wc: var(--violet); }
.widget[data-wid="k-notes"] { --wc: var(--cyan); } .widget[data-wid="k-routines"] { --wc: var(--violet); } .widget[data-wid="k-reach"] { --wc: var(--pink); }
.sk-card, .art-pane { --wc: var(--violet); }

/* ---- Panes over the stage: widgets, key figures, deadlines. Frost, a lit edge, a hairline and the drop of the kit;
   the lens is added by the script where it is affordable */
html:root body:not(.is-page) :is(.card, .kpi, .deadline, .hero) {
  border: 0; border-radius: var(--lg-r);
  background:
    var(--lg-over, linear-gradient(transparent, transparent)),
    linear-gradient(160deg, rgba(255,255,255,var(--lg-sheen)), rgba(255,255,255,0) 42%),
    color-mix(in srgb, var(--surface) var(--lg-a), transparent);
  box-shadow: inset 0 1px 0 var(--lg-rim), inset 0 0 0 1px var(--lg-hair), 0 8px 48px -12px var(--lg-drop);
  -webkit-backdrop-filter: var(--lg-f, blur(0px)) blur(var(--lg-blur)) saturate(var(--lg-sat));
  backdrop-filter: var(--lg-f, blur(0px)) blur(var(--lg-blur)) saturate(var(--lg-sat));
}
html:root body:not(.is-page) :is(.kpi, .deadline) { border-radius: var(--lg-r-m); }
html:root body:not(.is-page) .deadline.amber { --lg-over: linear-gradient(120deg, var(--warn-bg), transparent 72%); }
html:root body:not(.is-page) .deadline.red { --lg-over: linear-gradient(120deg, var(--crit-bg), transparent 72%); }
html:root body:not(.is-page) .dl-cards.in-card .deadline { background: var(--lg-over, linear-gradient(transparent, transparent)), var(--fill-4); box-shadow: none; border-radius: 18px; }   /* a deadline in the widget is an inset, not a second pane */
html:root body .errorcard { border-radius: var(--lg-r); }
html:root body .stage { border-radius: var(--lg-r); }

/* ---- Inset surfaces inside a pane: rows, tiles, fields. A fill of the label colour, no backdrop of their own (it would be the pane) */
html:root body :is(.select, .text-in, .ag-input, .mp-btn, .os-input, .atl-input, .atl-find, .hs-in):focus,
html:root body .mp-btn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--focus); outline: none; }
html:root body :is(.qbtn, .app-row, .launch-b, .art-row, .w-opt, .fbtn, .tl-col, .results li) { border-radius: var(--lg-r-s); }
html:root body .w-opt { border-radius: 18px; }
html:root body :is(.tag, .meta-chip, .badge, .cnt, .status, .os-kind) { border-radius: 999px; }
html:root body .tbl code { border-radius: 6px; }
html:root body :is(.bar, .mixbar span) { border-radius: 999px; }
html:root body .spenders .s-bar { border-radius: 999px; }

/* ---- Controls: capsules and discs of glass, the toolbar buttons of iOS 27. Small and floating, so the lens goes on these first.
   Pressed, a piece of glass swells (scale) and lights up where the finger is (--mx/--my, set by the script) */
html:root body :is(.btn, .icon-btn, .os-ibtn, .os-btn, .hs-atlas, .chip, .search input) {
  color: var(--ink); border: 0; border-radius: 999px;
  background:
    radial-gradient(90px circle at var(--mx, 50%) var(--my, -30%), rgba(255,255,255,calc(var(--lg-sheen) * var(--lg-spot, 0))), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,var(--lg-sheen)), rgba(255,255,255,0) 60%),
    color-mix(in srgb, var(--surface) var(--lg-a-ctl), transparent);
  box-shadow: inset 0 1px 0 var(--lg-rim), inset 0 0 0 1px var(--lg-hair), 0 6px 20px -8px var(--lg-drop);
  -webkit-backdrop-filter: var(--lg-f, blur(0px)) blur(var(--lg-bc, 6px)) saturate(var(--lg-sat));
  backdrop-filter: var(--lg-f, blur(0px)) blur(var(--lg-bc, 6px)) saturate(var(--lg-sat));
}
html:root body :is(.icon-btn, .os-ibtn) { border-radius: 50%; }
html:root body :is(.btn, .icon-btn, .os-ibtn, .os-btn, .hs-atlas, .chip):hover { --lg-spot: 1; }
html:root body :is(.btn, .icon-btn, .os-ibtn, .os-btn, .hs-atlas, .chip):active { --lg-spot: 1.6; scale: 1.06; }
html:root body .search input:focus { box-shadow: inset 0 1px 0 var(--lg-rim), 0 0 0 2px var(--focus), 0 6px 20px -8px var(--lg-drop); }
/* A labelled control in the tint: an opaque fill (a label on glass in a colour would depend on what is behind it) */
html:root body :is(.btn.primary, .os-btn.solid) {
  color: var(--on-accent);
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), var(--accent-btn);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 20px -8px var(--lg-drop);
}
html:root body .chip[aria-pressed="true"], html:root body .os-btn[aria-pressed="true"],
html:root body .os-ibtn[aria-pressed="true"], html:root body .w-menu[open] > .os-ibtn {
  color: var(--on-accent);
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), var(--accent-btn);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 20px -8px var(--lg-drop);
}
html:root body .chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
html:root body .btn[disabled] { opacity: .5; }

/* The same pieces inside a pane: flat fills (a second blur would only ever see the pane) */
html:root body :is(.card, .detail, .results, .w-pop, .hs-card, .os-card, .os-preview, .os-controls, .os-legendbox, .mp-pop, .atl-rail, .atl-chat, .agx-box, .atl-recent-pop, .note, .hero, .kpi, .deadline, .look)
  :is(.btn, .icon-btn, .os-ibtn, .os-btn, .chip) {

// One screen is a grid of C x R cells (about 68 px each), with Z columns on each side of the galaxy. A tile is

// One of the four key figures as a widget of its own
function kpiTile(k) { return buildKpis(TodayView.anim).children[k]; }

function buildToday(view) {
  const anim = view.anim = once('today');
  const hidden = new Set(view.layout.hidden);
  view.els = new Map();
  const ids = WIDGETS.filter(w => !hidden.has(w.id)).map(w => w.id);

    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); view.hide(id, true); }
    else if (e.key === 'PageUp' || e.key === 'PageDown') {   // to the previous / next page

    h('span', { class: 'hs-h-wide' }, 'Drag a widget to move it, drag its corner to resize it. S M L pick a size, − hides it. Drag to the screen edge for another page. Or focus a widget: arrow keys move it, Shift + arrow keys resize it.'),

  return h('div', { class: 'os-home' + (anim ? ' anim' : '') + (view.editing ? ' editing' : '') }, help, h('div', { class: 'home-3' }, mid));

// Fit the content of one tile to its box. It is script and not only CSS because what fits depends on the data (how many rows, which

function fitTile(el, wide) {

  if (!wide) return;
  const nodes = [], blocks = [];

    const n = body.querySelector(':scope > ' + sel);

    const list = rows ? (n.matches(rows) ? n : n.querySelector(rows)) : null, kids = list ? Array.from(list.children) : [];

    const o = nodes[i];

    o.kids.forEach((k, j) => k.classList.toggle('fit-off', j >= s.rows));
    if (o.more) {
      o.more.textContent = '+' + (o.kids.length - s.rows) + ' more';

  show(fitPlan(blocks, st => { show(st); return body.scrollHeight > body.clientHeight + 1; }));
  nodes.forEach((o, i) => { if (o.more && o.more.classList.contains('fit-off')) o.more.remove(); });

const TZ_CHOICES = [
  ['Europe/Berlin', 'Berlin'], ['Europe/London', 'London'], ['UTC', 'UTC'], ['America/New_York', 'New York'], ['America/Los_Angeles', 'Los Angeles'],
  ['America/Sao_Paulo', 'São Paulo'], ['Africa/Cairo', 'Cairo'], ['Asia/Dubai', 'Dubai'], ['Asia/Kolkata', 'India'], ['Asia/Shanghai', 'Beijing'],

  const dd = dayNum(z.date) - dayNum(localDate);

    const c = clockInfo(zone, now);

}

  const card = h('div', { class: 'card' }, h('h2', null, 'Clocks'));

    h('span', { class: 'clock-big', 'data-clock': 'local' }, pad(now.getHours()) + ':' + pad(now.getMinutes())),
    h('span', { class: 'clock-zone' }, 'Here · ' + localName, h('br'), h('span', { 'data-clock-date': '' }, fmtDay(now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()), { long: true })))));

      if (node.deadline) {

        ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, TAU);
        const dc = dd < 7 ? P.crit : dd < 14 ? P.warn : P.accent;
        ctx.strokeStyle = dc; ctx.lineWidth = 2; ctx.stroke();
        if (dd < 14 && EMPH[i] > 0.5) fx.pulseRing(ctx, x, y, r + 2, dc);
        ctx.globalAlpha = EMPH[i];
      }
      if (MATCH[i] && sel < 0) { ctx.beginPath(); ctx.arc(x, y, r + 4, 0, TAU); ctx.strokeStyle = P.accent; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    if (sel >= 0 && sel !== v.center) { ctx.beginPath(); ctx.arc(X(sel), Y(sel), v.rad[sel] * sc + 5, 0, TAU); ctx.strokeStyle = P.ink; ctx.lineWidth = 2.5; ctx.stroke(); }
    if (v.hover >= 0 && v.hover !== sel && v.hover !== v.center) { ctx.beginPath(); ctx.arc(X(v.hover), Y(v.hover), v.rad[v.hover] * sc + 4, 0, TAU); ctx.strokeStyle = P.ink2; ctx.lineWidth = 1.5; ctx.stroke(); }
    // Hexagon in the center
    const hr = 46 * k;
    ctx.beginPath(); tracePath(ctx, 'hex', cx, cy, hr / 1.12);
    ctx.fillStyle = P.surface; ctx.fill();
    ctx.strokeStyle = sel >= 0 && sel === v.center ? P.accent : P.ink; ctx.lineWidth = sel === v.center && sel >= 0 ? 3 : 2; ctx.stroke();
    if (hr > 22) {
      ctx.fillStyle = P.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let fs = clamp(hr * 0.24, 9, 15);
      ctx.font = '650 ' + fs + 'px ' + fontFam();
      const room = hr * 1.4;   // the hexagon is about 1.55 hr wide through its middle; the system font's width differs per OS
      if (ctx.measureText('CLAUDE.md').width <= room) ctx.fillText('CLAUDE.md', cx, cy);
      else {   // too narrow: two lines, shrunk only if even "CLAUDE" does not fit
        fs = Math.min(fs, fs * room / ctx.measureText('CLAUDE').width); ctx.font = '650 ' + fs + 'px ' + fontFam();
        ctx.fillText('CLAUDE', cx, cy - fs * 0.55); ctx.fillText('.md', cx, cy + fs * 0.6);
      }
    }
    // Labels: ring names, groups, selected nodes
    const labels = [];
    for (const ring of v.rings) labels.push({ x: cx, y: cy - (ring.r0 + ring.r1) / 2 * k, text: ring.label + ' · ' + ring.count, align: 'center', bold: true, size: 11.5, color: P.ink2, force: true });
    const lab = i => {
      const x = X(i), y = Y(i), right = x >= cx;
      return { x: x + (right ? 1 : -1) * (v.rad[i] * sc + 6), y, text: G.nodes[i].label, align: right ? 'left' : 'right' };
    };
    if (sel >= 0 && sel !== v.center) labels.push({ ...lab(sel), bold: true, force: true });
    if (v.hover >= 0 && v.hover !== v.center) labels.push({ ...lab(v.hover), bold: true });
    if (sel >= 0) G.nbr[sel].slice(0, 40).forEach(j => { if (j !== v.center) labels.push(lab(j)); });
    let mc = 0;
    if (state.query.trim().length >= 2) for (let i = 0; i < n && mc < 20; i++) if (MATCH[i] && i !== v.center) { labels.push(lab(i)); mc++; }
    for (const g of v.groups) {
      const am = (g.a0 + g.a1) / 2, arcLen = (g.a1 - g.a0) * g.r * k;
      if (arcLen < 70) continue;
      const right = Math.cos(am) >= 0;
      labels.push({ x: cx + Math.cos(am) * (g.r + 8) * k, y: cy + Math.sin(am) * (g.r + 8) * k, text: g.key, align: right ? 'left' : 'right', size: 11, color: P.muted, max: 26 });
    }
    if (k >= 1.6) { let c = 0; for (let i = 0; i < n && c < 150; i++) if (i !== v.center && EMPH[i] > 0.4) { labels.push(lab(i)); c++; } }
    drawLabels(ctx, labels, s.w, s.h);
  },
};

/* =====================================================================
   10. View: Links (force graph with typed arrays + grid)
   ===================================================================== */
const LINK_POS = new Map(); // Positions survive tab switches and data updates (in memory only)

function createSim() {
  const n = G.nodes.length, es = G.es, et = G.et, m = es.length;
  const x = new Float32Array(n), y = new Float32Array(n), vx = new Float32Array(n), vy = new Float32Array(n);
  const fixed = new Uint8Array(n), next = new Int32Array(n);
  const bias = new Float32Array(m), str = new Float32Array(m);
  const cnt = new Float32Array(n);
  for (let e = 0; e < m; e++) { cnt[es[e]]++; cnt[et[e]]++; }
  for (let e = 0; e < m; e++) {
    const a = cnt[es[e]], b = cnt[et[e]];
    bias[e] = a / (a + b);
    str[e] = 1 / Math.max(1, Math.min(a, b));
  }
  const L = 34, Q = 55, C = 190, C2 = C * C, GRAV = 0.018, DECAY = 0.6;
  let head = new Int32Array(1024);
  const sim = { x, y, vx, vy, fixed, alpha: 1, alphaTarget: 0, alphaMin: 0.004, alphaDecay: 0.0228 };
  function pair(i, j, al) {
    let dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
    if (d2 > C2) return;
    if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
    const w = Q * al / d2;
    vx[i] -= dx * w; vy[i] -= dy * w; vx[j] += dx * w; vy[j] += dy * w;
  }
  sim.active = () => sim.alpha >= sim.alphaMin || sim.alphaTarget > 0;
  sim.tick = () => {
    sim.alpha += (sim.alphaTarget - sim.alpha) * sim.alphaDecay;
    const al = sim.alpha;
    // Springs along the links
    for (let e = 0; e < m; e++) {
      const s = es[e], t = et[e];
      let dx = x[t] + vx[t] - x[s] - vx[s], dy = y[t] + vy[t] - y[s] - vy[s];
      const l = Math.sqrt(dx * dx + dy * dy) || 1e-3;
      const f = (l - L) / l * al * str[e];
      dx *= f; dy *= f;
      const b = bias[e];
      vx[t] -= dx * b; vy[t] -= dy * b; vx[s] += dx * (1 - b); vy[s] += dy * (1 - b);
    }
    // Repulsion via a grid (neighbor cells only) -> O(n) instead of O(n²)
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let i = 0; i < n; i++) { if (x[i] < minX) minX = x[i]; if (x[i] > maxX) maxX = x[i]; if (y[i] < minY) minY = y[i]; if (y[i] > maxY) maxY = y[i]; }
    let cell = C, cols = 0, rows = 0;
    for (;;) { cols = Math.floor((maxX - minX) / cell) + 1; rows = Math.floor((maxY - minY) / cell) + 1; if (cols * rows <= 65536) break; cell *= 2; }
    const cells = cols * rows;
    if (head.length < cells) head = new Int32Array(cells);
    head.fill(-1, 0, cells);
    for (let i = 0; i < n; i++) {
      const c = Math.floor((y[i] - minY) / cell) * cols + Math.floor((x[i] - minX) / cell);
      next[i] = head[c]; head[c] = i;
    }
    for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
      const c = cy * cols + cx;
      for (let i = head[c]; i >= 0; i = next[i]) {
        for (let j = next[i]; j >= 0; j = next[j]) pair(i, j, al);
        if (cx + 1 < cols) for (let j = head[c + 1]; j >= 0; j = next[j]) pair(i, j, al);
        if (cy + 1 < rows) {
          if (cx > 0) for (let j = head[c + cols - 1]; j >= 0; j = next[j]) pair(i, j, al);
          for (let j = head[c + cols]; j >= 0; j = next[j]) pair(i, j, al);
          if (cx + 1 < cols) for (let j = head[c + cols + 1]; j >= 0; j = next[j]) pair(i, j, al);
        }
      }
    }
    // Gravity toward the center + movement
    for (let i = 0; i < n; i++) {
      if (fixed[i]) { vx[i] = 0; vy[i] = 0; continue; }
      vx[i] -= x[i] * GRAV * al; vy[i] -= y[i] * GRAV * al;
      vx[i] *= DECAY; vy[i] *= DECAY;
      x[i] += vx[i]; y[i] += vy[i];
    }
  };
  return sim;
}

const LinksView = {
  mount(panel) {
    const v = this;
    v.panel = panel; v.cam = { x: 0, y: 0, k: 1 }; v.userMoved = false; v.hover = -1; v.drag = -1; v.raf = 0;
    v.ui = buildStage(panel, {
      title: 'Links', hint: 'Force graph of the wikilinks. Drag dots, pan the background, Ctrl + mouse wheel or two fingers to zoom. An area chip dims everything else.',
      onZoom: f => v.zoom(f), onReset: () => { v.userMoved = false; v.fit(); v.requestDraw(); },
    });
    v.surf = makeSurface(v.ui.stage, () => { if (!v.userMoved) v.fit(); v.draw(); });
    v.surf.canvas.setAttribute('aria-label', 'Graph of the links. Use search (key /) to select any note.');
    v.build();
    const toWorld = p => ({ x: (p.x - v.cam.x) / v.cam.k, y: (p.y - v.cam.y) / v.cam.k });
    v.offCtl = pointerControls(v.surf.canvas, {
      onDown: p => { const i = v.hit(p); if (i >= 0) { v.drag = i; v.sim.fixed[i] = 1; } },
      onDrag: (dx, dy, p) => {
        if (v.drag >= 0) {
          const w = toWorld(p);
          v.sim.x[v.drag] = w.x; v.sim.y[v.drag] = w.y;
          v.sim.alphaTarget = 0.25; if (v.sim.alpha < 0.25) v.sim.alpha = 0.25;
        } else { v.cam.x += dx; v.cam.y += dy; }
        v.userMoved = true; v.requestDraw();
      },
      onUp: () => { if (v.drag >= 0) { v.sim.fixed[v.drag] = 0; v.sim.alphaTarget = 0; v.drag = -1; v.requestDraw(); } },
      onPinch: (f, cx, cy, dx, dy) => { zoomAt(v.cam, f, cx, cy, 0.05, 10); v.cam.x += dx; v.cam.y += dy; v.userMoved = true; v.requestDraw(); },
      onWheel: (f, x, y) => { zoomAt(v.cam, f, x, y, 0.05, 10); v.userMoved = true; v.requestDraw(); },
      onWheelHint: () => v.ui.wheelHint(),
      onTap: p => { const i = v.hit(p); if (i >= 0) selectNode(G.nodes[i].id); else if (state.selected) selectNode(null); },
      onHover: p => {
        const i = v.hit(p);
        v.surf.canvas.classList.toggle('pointer', i >= 0);
        if (i !== v.hover) { v.hover = i; v.requestDraw(); }
        if (i >= 0) nodeTip(i, p.cx, p.cy); else hideTip();
      },
      onLeave: () => { if (v.hover !== -1) { v.hover = -1; v.requestDraw(); } hideTip(); },
    });
    canvasKeys(v.surf.canvas, {
      zoom: f => v.zoom(f), reset: () => { v.userMoved = false; v.fit(); v.requestDraw(); },
      pan: (dx, dy) => { v.cam.x += dx; v.cam.y += dy; v.userMoved = true; v.requestDraw(); },
    });
    v.offs = [bus.on('emph', () => v.requestDraw()), bus.on('theme', () => v.requestDraw()), bus.on('focus', id => v.focus(id)), bus.on('tick', () => v.requestDraw()), v.ui.offChips];
  },
  update() { this.save(); this.build(); },
  destroy() { cancelAnimationFrame(this.raf); this.raf = 0; this.save(); this.offCtl(); this.offs.forEach(f => f()); this.surf.destroy(); hideTip(); this.panel.replaceChildren(); },
  save() { const s = this.sim; G.nodes.forEach((n, i) => LINK_POS.set(n.id, [s.x[i], s.y[i]])); },
  zoom(f) { zoomAt(this.cam, f, this.surf.w / 2, this.surf.h / 2, 0.05, 10); this.userMoved = true; this.requestDraw(); },
  requestDraw() { if (!this.raf) this.raf = requestAnimationFrame(() => this.frame()); },
  build() {
    const v = this, n = G.nodes.length;
    const sim = createSim();
    let seeded = 0;
    const areaIdx = new Map(AREAS.map((a, i) => [a.key, i]));
    G.nodes.forEach((node, i) => {
      const p = LINK_POS.get(node.id);
      if (p) { sim.x[i] = p[0]; sim.y[i] = p[1]; seeded++; return; }
      // Start position: areas as pie slices so clusters form faster
      const a = (areaIdx.has(node.areaDef.key) ? areaIdx.get(node.areaDef.key) : 9) / 10 * TAU + (Math.random() - 0.5) * 0.9;
      const r = 60 + Math.random() * (40 + Math.sqrt(n) * 12);
      sim.x[i] = Math.cos(a) * r; sim.y[i] = Math.sin(a) * r;
    });
    sim.alpha = seeded === n && n ? 0 : seeded ? 0.6 : 1;
    v.sim = sim;
    // Precompute so the first frame already looks settled
    const t0 = performance.now(), budget = RM.matches ? 700 : 90;
    while (sim.active() && performance.now() - t0 < budget) sim.tick();
    const top = G.byDeg.slice(0, 5).map(i => G.nodes[i].label + ' (' + G.nodes[i].deg + ')').join(', ');
    v.ui.sr.textContent = 'Graph: ' + n + ' notes, ' + G.es.length + ' links. Most linked: ' + (top || 'none') + '.';
    if (!v.userMoved) v.fit();
    v.requestDraw();
  },
  frame() {
    const v = this, s = v.sim;
    v.raf = 0;
    let again = false;
    if (s.active()) {
      if (RM.matches && v.drag < 0) { let c = 0; while (s.active() && c++ < 600) s.tick(); }
      else { s.tick(); again = true; }
    }
    if (!v.userMoved) v.fit();
    v.draw();
    if (again && s.active()) v.requestDraw();
  },
  fit() {
    const v = this, s = v.sim, n = G.nodes.length;
    if (!v.surf || !v.surf.w || !n) { v.cam = { x: v.surf ? v.surf.w / 2 : 0, y: v.surf ? v.surf.h / 2 : 0, k: 1 }; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let i = 0; i < n; i++) { minX = Math.min(minX, s.x[i]); maxX = Math.max(maxX, s.x[i]); minY = Math.min(minY, s.y[i]); maxY = Math.max(maxY, s.y[i]); }
    const bw = Math.max(60, maxX - minX), bh = Math.max(60, maxY - minY), pad = 36;
    v.cam.k = clamp(Math.min((v.surf.w - pad * 2) / bw, (v.surf.h - pad * 2) / bh), 0.05, 3);
    v.cam.x = v.surf.w / 2 - (minX + maxX) / 2 * v.cam.k;
    v.cam.y = v.surf.h / 2 - (minY + maxY) / 2 * v.cam.k;
  },
  rad(i) { return (2 + Math.sqrt(G.nodes[i].deg) * 0.9 + 0.5 * Math.log10(G.nodes[i].size + 10)) * clamp(Math.sqrt(this.cam.k), 0.6, 2); },
  hit(p) {
    const v = this, s = v.sim, k = v.cam.k;
    let best = -1, bd = Infinity;
    const extra = p.touch ? 14 : 4;
    for (let i = 0; i < G.nodes.length; i++) {
      if (EMPH[i] < 0.15) continue;
      const d = Math.hypot(s.x[i] * k + v.cam.x - p.x, s.y[i] * k + v.cam.y - p.y);
      if (d < v.rad(i) + extra && d < bd) { bd = d; best = i; }

  },
  focus(id) {
    const v = this, i = G.index.get(id);
    if (i === undefined || !v.surf.w) return;
    v.cam.k = Math.max(v.cam.k, 1.2);
    v.cam.x = focusX(v.surf) - v.sim.x[i] * v.cam.k; v.cam.y = v.surf.h / 2 - v.sim.y[i] * v.cam.k;
    v.userMoved = true; v.requestDraw();
  },
  draw() {
    const v = this, surf = v.surf, s = v.sim;
    if (!surf.w) return;
    surf.begin();
    const ctx = surf.ctx, k = v.cam.k, ox = v.cam.x, oy = v.cam.y, n = G.nodes.length, es = G.es, et = G.et;
    const sel = selIndex();
    const dimMode = sel >= 0 || state.areas.size > 0 || state.query.trim().length >= 2;
    // Edges: weak ones in one path, strong ones in a second (few draw calls)
    ctx.strokeStyle = P.edge; ctx.lineWidth = 0.8;
    const strong = new Path2D(), weak = new Path2D(), hot = new Path2D();
    for (let e = 0; e < es.length; e++) {
      const a = es[e], b = et[e];
      const x1 = s.x[a] * k + ox, y1 = s.y[a] * k + oy, x2 = s.x[b] * k + ox, y2 = s.y[b] * k + oy;
      let path;
      if (sel >= 0 && (a === sel || b === sel)) path = hot;
      else if (v.hover >= 0 && sel < 0 && (a === v.hover || b === v.hover)) path = hot;
      else if (dimMode && (EMPH[a] < 0.5 || EMPH[b] < 0.5)) path = weak;
      else path = strong;
      path.moveTo(x1, y1); path.lineTo(x2, y2);
    }
    ctx.globalAlpha = 0.035; ctx.stroke(weak);
    ctx.globalAlpha = dimMode ? 0.22 : 0.11; ctx.stroke(strong);
    ctx.globalAlpha = sel >= 0 ? 0.85 : 0.6; ctx.lineWidth = sel >= 0 ? 1.6 : 1.1; ctx.stroke(hot);
    // Nodes (dimmed ones first so highlighted ones sit on top)
    const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => EMPH[a] - EMPH[b]);
    for (const i of order) {
      const x = s.x[i] * k + ox, y = s.y[i] * k + oy;
      if (x < -30 || y < -30 || x > surf.w + 30 || y > surf.h + 30) continue;
      ctx.globalAlpha = EMPH[i];
      const r = v.rad(i);
      drawNodeShape(ctx, G.nodes[i].areaDef, x, y, r);
      if (MATCH[i] && sel < 0) { ctx.beginPath(); ctx.arc(x, y, r + 4, 0, TAU); ctx.strokeStyle = P.accent; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    const ring = (i, color, wdt, pad) => { ctx.beginPath(); ctx.arc(s.x[i] * k + ox, s.y[i] * k + oy, v.rad(i) + pad, 0, TAU); ctx.strokeStyle = color; ctx.lineWidth = wdt; ctx.stroke(); };
    for (let i = 0; i < n; i++) {
      const dl = G.nodes[i].deadline;
      if (!dl || EMPH[i] < 0.5) continue;
      const dd = daysFromToday(dl);
      if (dd < 14) fx.pulseRing(ctx, s.x[i] * k + ox, s.y[i] * k + oy, v.rad(i), dd < 7 ? P.crit : P.warn);
    }
    if (sel >= 0) { ring(sel, P.ink, 2.5, 4); fx.pulseRing(ctx, s.x[sel] * k + ox, s.y[sel] * k + oy, v.rad(sel) + 2, P.accent); }
    if (v.hover >= 0 && v.hover !== sel) ring(v.hover, P.ink2, 1.5, 3);
    // Labels: top nodes, selection, neighbors, search hits (capped)
    const labels = [];
    const lab = (i, extra) => ({ x: s.x[i] * k + ox + v.rad(i) + 5, y: s.y[i] * k + oy, text: G.nodes[i].label, ...extra });
    if (sel >= 0) labels.push(lab(sel, { bold: true, force: true }));
    if (v.hover >= 0) labels.push(lab(v.hover, { bold: true }));
    if (sel >= 0) G.nbr[sel].slice().sort((a, b) => G.nodes[b].deg - G.nodes[a].deg).slice(0, 16).forEach(j => labels.push(lab(j)));
    if (state.query.trim().length >= 2) { let c = 0; for (let i = 0; i < n && c < 20; i++) if (MATCH[i]) { labels.push(lab(i)); c++; } }
    const topN = Math.min(n, k > 1.8 ? 60 : 14);
    for (let t = 0; t < topN; t++) { const i = G.byDeg[t]; if (EMPH[i] > 0.4) labels.push(lab(i, { color: P.ink2 })); }
    drawLabels(ctx, labels, surf.w, surf.h);
  },
};

/* =====================================================================
   11. View: Timeline (file changes + routine runs per day)
   ===================================================================== */
const TimelineView = {
  day: null, // selected day survives data updates
  mount(panel) { this.panel = panel; this.update(); },
  update() {
    const v = this, today = dayNum(G.today), DAYS = 30;
    const days = Array.from({ length: DAYS }, (_, k) => dayStr(today - (DAYS - 1 - k)));
    const runsBy = new Map();
    for (const r of G.runs) { const d = String(r.started || '').slice(0, 10); if (!runsBy.has(d)) runsBy.set(d, []); runsBy.get(d).push(r); }
    const per = days.map(d => {
      const ids = Array.isArray(G.changes[d]) ? G.changes[d].map(String) : [];
      const by = new Map();
      for (const id of ids) { const i = G.index.get(id); const a = i === undefined ? OTHER_AREA : G.nodes[i].areaDef; by.set(a, (by.get(a) || 0) + 1); }
      return { d, ids, by, runs: (runsBy.get(d) || []).slice().sort((a, b) => String(a.started).localeCompare(String(b.started))) };
    });
    const max = Math.max(1, ...per.map(p => p.ids.length));
    if (!v.day || !days.includes(v.day)) { const last = per.slice().reverse().find(p => p.ids.length || p.runs.length); v.day = last ? last.d : G.today; }
    const totalChanges = per.reduce((a, p) => a + p.ids.length, 0), totalRuns = per.reduce((a, p) => a + p.runs.length, 0);

    const legend = h('div', { class: 'legend', 'aria-hidden': 'true' },
      AREAS.filter(a => per.some(p => p.by.has(a))).map(a => h('span', null, h('i', { class: 'dot', style: { background: a.color } }), a.label)),
      h('span', null, h('i', { class: 'rd ok' }), 'Run OK'), h('span', null, h('i', { class: 'rd failed' }), 'failed'), h('span', null, h('i', { class: 'rd skipped' }), 'skipped'));
    const cols = h('div', { class: 'tl-cols' });
    let prevMonth = -1;
    let colNo = 0;
    for (const p of per) {
      const dn = dayNum(p.d), date = new Date(dn * 864e5), wd = date.getUTCDay();
      colNo++;
      const bar = h('div', { class: 'tl-bar' });
      for (const a of AREAS.concat([OTHER_AREA])) {
        const c = p.by.get(a);
        if (c) bar.append(h('span', { style: { height: Math.max(3, Math.round(c / max * 146)) + 'px', background: a.color, '--d': colNo * 16 + 'ms' } }));
      }
      const month = date.getUTCMonth();
      const dateLbl = h('span', { class: 'tl-date' }, WD[wd].slice(0, 2), h('br'), pad(date.getUTCDate()) + (month !== prevMonth ? ' ' + MONTHS[month] : ''));

// Fields: filtered by search text and group, in a fixed order (rest at the end)
function atlasGroups(ags, query, only) {
  const words = String(query || '').trim().toLocaleLowerCase('en').split(/\s+/).filter(Boolean);
  const by = new Map();
  for (const a of ags) {
    const g = String(a.group || 'Other');

    if (words.length) {
      const hay = (String(a.name || '') + ' ' + String(a.description || '') + ' ' + g + ' ' + (Array.isArray(a.keywords) ? a.keywords.join(' ') : '')).toLocaleLowerCase('en');
      if (!words.every(w => hay.includes(w))) continue;

    const k = String(j.thread || j.id);

    by.get(k).push(j);

  const out = [];
  for (const [id, list] of by) {
    list.sort((a, b) => String(a.started || '').localeCompare(String(b.started || '')));
    const last = list[list.length - 1];
    out.push({ id, jobs: list, title: String(list[0].instruction || ''), agent: String(last.agent || ''), last: String(last.started || ''),

  if (job.instruction) parts.push(h('p', { class: 'sk-ins' }, 'Job: ' + trunc(String(job.instruction), 160)));
  const res = String(job.result || '');
  if (job.status === 'ok' && res) {

      copyButton(() => res),
      G.artifacts.some(a => a.id === artId) ? h('button', { type: 'button', class: 'btn small', onclick: () => openArtifact(artId) }, 'In artifacts') : null));
  } else if (job.status === 'ok') {

  } else {
    parts.push(h('div', { class: 'err-box' }, h('strong', null, (JOB_STATUS[job.status] || 'Error') + '. '), job.note ? String(job.note) : 'No further details.'));
  }
  const meta = [];
  if (job.duration_s != null) meta.push(h('span', { class: 'meta-chip' }, 'Duration ', h('b', null, fmtDur(job.duration_s))));
  parts.push(h('div', { class: 'chips' }, meta, jobChips(job)));

}

// Model: nodes + edges from G. Pure function of the data, no DOM.
function osBuild(g) {
  const nodes = [], links = [], idx = new Map();
  const add = o => { o.i = nodes.length; o.x = o.y = o.vx = o.vy = o.bx = o.by = o.tx = o.ty = 0; o.a = 0; o.nb = []; o.ring = 0; o.delay = 0; nodes.push(o); return o; };
  const link = (a, b, w) => { if (a && b) links.push({ a: a.i, b: b.i, w: w || 1 }); };
  const hub = add({ k: 'hub', grp: 'hub', label: 'CLAUDE.md', key: 'hub' });
  const apps = VIEWS.filter(vw => vw.id !== 'os').map(vw => { const n = add({ k: 'app', grp: 'app', label: vw.label, key: 'app:' + vw.id, view: vw.id }); link(hub, n, 2); return n; });
  const skills = g.skills.map(s => { const n = add({ k: 'skill', grp: 'skill', label: s.name, key: 'skill:' + s.id, skill: s }); link(hub, n, 2); return n; });
  const routines = g.routines.map(r => { const n = add({ k: 'routine', grp: 'routine', label: String(r.id), key: 'routine:' + r.id, routine: r }); link(hub, n, 2); return n; });
  for (const rn of routines) {
    const hay = (String(rn.routine.id) + ' ' + String(rn.routine.description || '')).toLowerCase();
    for (const sn of skills) if (hay.includes(sn.skill.id.toLowerCase())) link(sn, rn, 2);
  }
  const counts = new Map();
  for (const n of g.nodes) if (n.id !== 'CLAUDE.md') counts.set(n.areaDef, (counts.get(n.areaDef) || 0) + 1);
  const areaNodes = new Map();
  for (const [def, c] of Array.from(counts).sort((p, q) => q[1] - p[1])) {
    const n = add({ k: 'area', grp: 'memory', label: def.label, key: 'area:' + def.key, area: def, count: c });
    areaNodes.set(def, n); link(hub, n, 2);
  }
  const notes = [];
  for (const gi of g.byDeg) {
    if (notes.length >= OS_MAX_NOTES) break;
    const nd = g.nodes[gi];
    if (nd.id === 'CLAUDE.md') continue;
    const n = add({ k: 'note', grp: 'memory', label: nd.label, key: 'note:' + nd.id, ni: gi, area: nd.areaDef, deg: nd.deg, folder: osFolderOf(nd.id) });
    idx.set(gi, n); notes.push(n); link(areaNodes.get(nd.areaDef), n, 1);
  }
  for (let e = 0; e < g.es.length && links.length < 2400; e++) {
    const a = idx.get(g.es[e]), b = idx.get(g.et[e]);
    if (a && b) link(a, b, 0.6);
  }
  for (const l of links) { nodes[l.a].nb.push(l.b); nodes[l.b].nb.push(l.a); }
  const m = { nodes, links, hub, apps, skills, routines, areas: Array.from(areaNodes.values()), notes, total: g.nodes.length };
  m.clusters = osClusterize(m);
  return m;
}

// Clusters ("departments"): per area a swarm of area node + notes, plus skills, apps, routines.
// Sets n.cl (index, hub: -1) and n.br (fixed brightness jitter per dot).
function osClusterize(m) {
  const list = [], by = new Map();
  for (const n of m.nodes) {
    n.br = 0.6 + 0.32 * ((n.i * 0.6180339) % 1);
    if (n.k === 'hub') { n.cl = -1; continue; }
    const g = n.k === 'note' || n.k === 'area' ? ['area:' + n.area.key, n.area.label, OS_AREA_COLOR[n.area.key] || OS_C.memory] : OS_GROUPS.find(x => x[0] === n.k);
    let c = by.get(g[0]);
    if (!c) { c = { key: g[0], kind: n.k === 'note' || n.k === 'area' ? 'area' : n.k, label: g[1], color: g[2], nodes: [], x: 0, y: 0, r: 0 }; by.set(g[0], c); list.push(c); }
    n.cl = list.indexOf(c); c.nodes.push(n);

// Distance between two cell centers in the hex grid of apps and routines (pixels, without zoom)
function osCellSize(size) { return osNodeRadius({ k: 'app' }, size) * 1.04; }

// Distribute clusters around CLAUDE.md: circles around the center, overlaps are pushed apart.
// Pure and deterministic. Result: c.x, c.y, c.r (pixels, center = hub).
function osPlaceClusters(m, R, size) {
  const cs = m.clusters, sp = osNodeRadius({ k: 'note', deg: 4 }, size) * 2.5, cell = osCellSize(size);
  for (const c of cs) {
    const n = c.nodes.length;
    c.r = c.kind === 'app' || c.kind === 'routine' ? cell * (1.3 + 1.05 * Math.sqrt(n)) : sp * (0.9 + 0.7 * Math.sqrt(n)) + 6;
  }
  // Order: large areas first, skills/apps/routines right after each other (neighbors)
  const order = cs.filter(c => c.kind === 'area').sort((a, b) => b.nodes.length - a.nodes.length)
    .concat(cs.filter(c => c.kind === 'skill'), cs.filter(c => c.kind === 'app'), cs.filter(c => c.kind === 'routine'));
  const sum = order.reduce((s, c) => s + c.r, 0) || 1, hubGap = R * 0.1;
  let a = -Math.PI * 0.85;
  for (const c of order) {
    const span = (c.r / sum) * TAU, mid = a + span / 2, d = hubGap + c.r * 1.1;
    c.x = Math.cos(mid) * d * 1.25; c.y = Math.sin(mid) * d * 0.85;
    a += span;
  }
  for (let it = 0; it < 120; it++) {
    for (let i = 0; i < order.length; i++) {
      const p = order[i];
      for (let j = i + 1; j < order.length; j++) {
        const q = order[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 0.01, min = p.r + q.r + 10;
        if (d < min) { const f = (min - d) / d * 0.5; p.x -= dx * f; p.y -= dy * f; q.x += dx * f; q.y += dy * f; }
      }
      const d = Math.hypot(p.x, p.y) || 0.01, min = p.r + hubGap;
      if (d < min) { p.x *= min / d; p.y *= min / d; }
      else { p.x *= 0.99; p.y *= 0.99; }   // slight pull to the center so clusters stay close together
    }
  }
  return order;
}

// Camera that centers all clusters of the force layout on a w × h stage (small vaults are scaled up)
function osFit(m, w, h) {
  let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
  for (const c of m.clusters) { x0 = Math.min(x0, c.x - c.r); x1 = Math.max(x1, c.x + c.r); y0 = Math.min(y0, c.y - c.r); y1 = Math.max(y1, c.y + c.r); }
  const k = clamp(Math.min((w * 0.74) / Math.max(1, x1 - x0), (h * 0.8) / Math.max(1, y1 - y0)), 0.5, 2.4);
  return { x: -((x0 + x1) / 2) * k, y: -((y0 + y1) / 2) * k, k };
}

// Targets in the force layout: notes as a phyllotaxis disc around their area node (most important inside),
// apps and routines as hex cells, skills as a small disc. The physics then deforms this into clouds.
function osForceTargets(m, R, size) {
  osPlaceClusters(m, R, size);
  const sp = osNodeRadius({ k: 'note', deg: 4 }, size) * 2.5, cell = osCellSize(size);
  for (const c of m.clusters) {
    if (c.kind === 'app' || c.kind === 'routine') {
      const cells = osHexSpiral(c.nodes.length);
      c.nodes.forEach((n, j) => { const q = cells[j]; n.bx = c.x + cell * Math.sqrt(3) * (q[0] + q[1] / 2); n.by = c.y + cell * 1.5 * q[1]; });
      continue;
    }
    const lead = c.nodes.find(n => n.k === 'area'), rest = c.nodes.filter(n => n !== lead).sort((p, q) => (q.deg || 0) - (p.deg || 0));
    if (lead) { lead.bx = c.x; lead.by = c.y; }
    rest.forEach((n, j) => { const k = j + (lead ? 1.6 : 0.5), r = sp * 0.7 * Math.sqrt(k), a = k * 2.39996; n.bx = c.x + Math.cos(a) * r; n.by = c.y + Math.sin(a) * r; });
  }
}

// Spiral of hexagons (axial), n cells
function osHexSpiral(n) {
  const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const out = [[0, 0]];
  for (let ring = 1; out.length < n; ring++) {
    let q = -ring, r = ring;
    for (let i = 0; i < 6; i++) for (let j = 0; j < ring; j++) { out.push([q, r]); q += dirs[i][0]; r += dirs[i][1]; }
  }
  return out.slice(0, n);
}

// Target positions (unrotated) per layout. R = stage radius in pixels. Only visible nodes count.
function osTargets(m, name, R, expanded) {
  const put = (n, x, y, ring) => { n.bx = x; n.by = y; n.ring = ring; };
  const onRing = (list, r, a0, ring) => list.forEach((n, i) => { const a = a0 + (i / Math.max(1, list.length)) * TAU; put(n, Math.cos(a) * r, Math.sin(a) * r, ring); });
  put(m.hub, 0, 0, 0);
  const areaIdx = n => m.areas.findIndex(x => x.area === n.area);
  if (name === 'rings') {
    const sk = m.skills.length ? 0.19 : 0;
    onRing(m.skills, R * sk, -Math.PI / 2, 0);
    onRing(m.apps, R * (sk ? 0.38 : 0.3), -Math.PI / 2, 1);
    onRing(m.routines, R * (sk ? 0.56 : 0.5), -Math.PI / 2 + 0.3, 2);
    const total = m.areas.reduce((s, a) => s + a.count, 0) || 1;
    let a0 = -Math.PI / 2;
    for (const area of m.areas) {
      const span = Math.max(0.35, (area.count / total) * TAU), mid = a0 + span / 2;
      put(area, Math.cos(mid) * R * 0.72, Math.sin(mid) * R * 0.72, 3);
      m.notes.filter(n => n.area === area.area).forEach((n, j) => {
        const f = (j * 0.618034) % 1, a = a0 + span * (0.06 + 0.88 * f), r = R * (0.8 + 0.18 * ((j % 4) / 3));
        put(n, Math.cos(a) * r, Math.sin(a) * r, 3);

      a0 += span;
    }
  } else if (name === 'circle') {
    const inner = [].concat(m.skills, m.apps, m.routines, m.areas), outer = expanded ? m.notes.slice().sort((p, q) => areaIdx(p) - areaIdx(q)) : [];
    if (!outer.length) onRing(inner, R * 0.82, -Math.PI / 2, 1);
    else { onRing(inner, R * 0.5, -Math.PI / 2, 1); onRing(outer, R * 0.92, -Math.PI / 2, 2); }
    if (!expanded) m.notes.forEach(n => put(n, 0, 0, 2));
  } else if (name === 'hex') {
    const order = [m.hub].concat(m.skills, m.apps, m.routines);
    for (const area of m.areas) { order.push(area); if (expanded) for (const n of m.notes) if (n.area === area.area) order.push(n); }
    let K = 0; while (1 + 3 * K * (K + 1) < order.length) K++;
    const s = (R * 0.96) / (Math.sqrt(3) * (K + 0.5)), cells = osHexSpiral(order.length);
    order.forEach((n, i) => { const c = cells[i]; put(n, s * Math.sqrt(3) * (c[0] + c[1] / 2), s * 1.5 * c[1], 0); });
    if (!expanded) m.notes.forEach(n => put(n, 0, 0, 0));
    m.hexSize = s;
  } else if (name === 'force') {
    osForceTargets(m, R, OS_PREFS.size);
    m.hub.bx = m.hub.by = 0;
  }
}

function osNodeRadius(n, size) {
  const base = n.k === 'hub' ? 8 : n.k === 'app' || n.k === 'routine' ? 12 : n.k === 'skill' ? 6.5 : n.k === 'area' ? 6.5 : 2.3 + Math.min(3.7, (n.deg || 0) * 0.3);
  return base * Math.max(0.3, size);
}
function osColor(n) {
  if (n.k === 'hub') return '#ffc861';
  if (n.k === 'app') return OS_C.app;
  if (n.k === 'skill') return OS_C.skill;
  if (n.k === 'routine') return OS_C.routine;
  if (n.k === 'note' && OS_PREFS.group === 'folders' && n.folder) return osFolderColor(n.folder);
  return OS_AREA_COLOR[n.area.key] || OS_C.memory;
}
// Shape per kind: apps and routines as hex cell (point up), skills as sparkle star, otherwise circle
function osShape(ctx, k, x, y, r) {
  ctx.beginPath();
  if (k === 'app' || k === 'routine') { for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * TAU / 6; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
  else if (k === 'skill') {
    for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * TAU / 8, rr = i % 2 ? r * 0.38 : r * 1.35; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath();
  }
  else ctx.arc(x, y, r, 0, TAU);

// Claude Code mascot (the "squid") as pixel art: # = body, o = eye. Logo of the CLAUDE.md hub.
const OS_SQUID = ['..#######..', '..#######..', '..#o###o#..', '###########', '###########', '..#######..', '..#.#.#.#..', '..#.#.#.#..'];
function osSquid(ctx, x, y, w) {
  const c = w / 11, x0 = x - w / 2, y0 = y - (OS_SQUID.length * c) / 2 - c * 0.2;
  ctx.fillStyle = '#e07a4f';   // the mascot keeps its own brand colour
  OS_SQUID.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === '#') ctx.fillRect(x0 + i * c, y0 + j * c, c + 0.4, c + 0.4); });
  ctx.fillStyle = '#1b0f0a';
  OS_SQUID.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === 'o') ctx.fillRect(x0 + i * c, y0 + j * c, c + 0.4, c + 0.4); });
}
// Glow dot as a prerendered sprite per color (64 px): white core, colored core, soft halo.
// Drawn with additive blending, so dense clouds glow by themselves. The core edge sits at 1/3 of the radius.
const OS_SPRITES = new Map();

  let c = OS_SPRITES.get(col);

  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffffd0'); gr.addColorStop(0.07, col + 'ee'); gr.addColorStop(0.3, col + 'bb'); gr.addColorStop(0.34, col + '2a');
  gr.addColorStop(0.55, col + '0a'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);

// An app's icon from TAB_ICONS (16-unit grid) as Path2D, cached
const OS_ICONS = new Map();
function osIcon(view) {
  if (!OS_ICONS.has(view)) {
    const d = typeof TAB_ICONS !== 'undefined' && TAB_ICONS[view];
    OS_ICONS.set(view, d && typeof Path2D !== 'undefined' ? d.map(p => new Path2D(p)) : null);
  }
  return OS_ICONS.get(view);

// Fade in on arrival: 0 → 1 over dur seconds, easing out
function osArriveEase(t, dur) { const x = Math.max(0, Math.min(1, t / (dur || 1))); return 1 - Math.pow(1 - x, 3); }

// Balls: skills (bolt) and artifacts (page, note, job), newest first

      meta: s.model + (s.effort ? ' · ' + s.effort : ''), path: 'skills/' + s.id + '/SKILL.md', icon: SKILL_ICON, count: s.runs_today || 0, skill: s,

// Galaxy: a procedural barred spiral galaxy (Milky Way type) inside the unit ball. The disc lies in the x/z plane (y is up).
// Structure: a bright yellowish bulge, an elongated golden bar whose two ends feed the two major arms (arms 0 and 2); two
// minor arms (1 and 3) are fainter and shorter; a thin, dense, faint disc of unresolved stars (the milky band); blue young
// clusters and pink HII patches strung along the arms; a sparse halo with a few globular clusters. Besides the stars the cloud
// holds two diffuse roles that are particles like all the others: GLOW (big, faint, additive: the unresolved starlight that
// makes the stars read as one band) and DUST (medium, dark, darkening: the lanes on the inner edge of the arms, along the bar
// and across the bulge); see galaxyMistPoint(). Every particle takes its target from galaxyPoint() / galaxyMistPoint().
const GALAXY_PALETTE_STD = Object.freeze(['#fff1d6', '#ffc86b', '#cfe0ff', '#6f9bff', '#9a7bff', '#4fd6ff', '#ff6fb5', '#ffe08a']);
// 0 warm white, 1 amber gold (old bar and bulge stars), 2 pale blue, 3 blue (young), 4 violet (rim), 5 cyan (young), 6 pink (HII regions), 7 pale yellow (bulge)
const GALAXY_PALETTE = GALAXY_PALETTE_STD.slice();   // the colours in use: the Appearance sheet can change them (applyLook)
// What the Appearance sheet has chosen for the cloud: its form (GALAXY_FORMS) and the colour of the dust. shape and colour count the
// changes, so what is built from the cloud or its colours (cloudSoA, the draw lists, the GPU buffers, the agent stars) knows to rebuild.
const GALAXY_LOOK = { form: 'spiral', dust: '#0a0618', shape: 0, colour: 0 };
const GALAXY_ARMS = 4;      // number of spiral arms: 2 major (0, 2) and 2 minor (1, 3)
const GALAXY_ARM_W = [1, 0.55, 1, 0.55];   // star share of each arm
const GALAXY_ARM_END = [0.97, 0.8, 0.97, 0.8];   // radius at which each arm ends (the minor ones are shorter)
const GALAXY_ARM_START = [0.2, 0.42, 0.2, 0.42];   // radius at which each arm begins: the major ones at the bar's ends, the minor ones further out
const GALAXY_WIND = 2.7;    // logarithmic spiral: angle gained per unit of ln(r); pitch angle = atan(1 / WIND), about 20 degrees (open enough not to close a ring around the bar)
const GALAXY_R0 = 0.2;      // radius where the arms leave the bar = half length of the bar
const GALAXY_BAR = 0.55;    // position angle of the bar in the disc plane (rad)
const GALAXY_TILT = 0.66;   // tilt of the disc towards the viewer (rad): sin(tilt) = 0.61 is the flattening, about 52 degrees from face-on
const GALAXY_BULGE = 0.12;  // shares of the particles: bulge, bar, halo, globular clusters, young clusters, HII patches, smooth arm stars
const GALAXY_BARS = 0.08;
const GALAXY_HALO = 0.045;
const GALAXY_GLOB = 0.012;
const GALAXY_YOUNG = 0.045;
const GALAXY_HII = 0.02;
const GALAXY_SMOOTH = 0.3;  // the rest (about a third) is the thin disc, partly gathered along the arms
const galaxySpeed = r => 0.065 + 0.04 * Math.exp(-r / 0.3);   // angular speed (rad/s): inner faster than outer, slow
const GALAXY_PATTERN = galaxySpeed(0.62);   // arms, bar and their clusters turn rigidly at this speed (a density wave: the pattern stays), the rest differentially
const galaxyArmAngle = (arm, r) => GALAXY_BAR + arm * TAU / GALAXY_ARMS + GALAXY_WIND * Math.log(r / GALAXY_R0);
// Radius at which some arm passes angle theta, closest to rMid (agents sit on arms)
function galaxyArmRadius(theta, rMid) {
  const per = TAU / GALAXY_ARMS;
  let d = (((theta - galaxyArmAngle(0, rMid)) % per) + per) % per;
  if (d > per / 2) d -= per;
  return rMid * Math.exp(d / GALAXY_WIND);
}
// Clusters, fixed once (own generator): young blue clusters and pink HII patches on the arms, globular clusters in the halo.
// Fields: x/y/z (galaxy space), s (radius), arm
let GALAXY_KNOTS = null;
function galaxyKnots() {
  if (GALAXY_KNOTS) return GALAXY_KNOTS;
  let s = 71205317;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const wsum = GALAXY_ARM_W.reduce((a, b) => a + b, 0);
  const armOf = () => { let u = rnd() * wsum, a = 0; while (a < GALAXY_ARMS - 1 && u >= GALAXY_ARM_W[a]) { u -= GALAXY_ARM_W[a]; a++; } return a; };
  const onArm = (n, r0, r1, s0, s1, off) => Array.from({ length: n }, () => {
    const arm = armOf(), r = Math.min(GALAXY_ARM_END[arm] - 0.03, Math.max(GALAXY_ARM_START[arm] + 0.05, r0 + (r1 - r0) * rnd())), th = galaxyArmAngle(arm, r) + (rnd() - 0.5) * 0.16 + off;
    return { x: Math.cos(th) * r, y: (rnd() - 0.5) * 0.03, z: Math.sin(th) * r, s: s0 + (s1 - s0) * rnd(), arm };
  });
  const glob = Array.from({ length: 7 }, () => {
    const r = 0.4 + 0.5 * rnd(), u = rnd() * 2 - 1, th = rnd() * TAU, q = Math.sqrt(1 - u * u);
    return { x: Math.cos(th) * q * r, y: u * r, z: Math.sin(th) * q * r, s: 0.016 + 0.014 * rnd(), arm: -1 };
  });
  return (GALAXY_KNOTS = { young: onArm(30, 0.3, 0.94, 0.016, 0.034, 0), hii: onArm(24, 0.3, 0.9, 0.022, 0.045, -0.04), glob });
}
// Particle i of the galaxy; rnd: seeded generator in [0, 1). Every 24th particle is a bright cluster star in an arm
// (isBrightOrb), so these never land in the bulge or the bar (r >= 0.4). Fields: x/y/z, r (distance from the center), ci (GALAXY_PALETTE),
// sp (angular speed), sz (size), ph (twinkle phase), br (brightness), arm (-1: bulge, bar, halo or inter-arm)
function galaxyPoint(i, rnd) {
  const g = () => (rnd() + rnd() + rnd() - 1.5) * 2;   // roughly normal, bounded to +-3
  const star = i % 24 === 7, k = rnd(), K = galaxyKnots();
  let x = 0, y = 0, z = 0, ci = 0, sz = 1, br = 1, arm = -1, rigid = false;
  const wsum = GALAXY_ARM_W.reduce((a, b) => a + b, 0);
  const armOf = () => { let u = rnd() * wsum, a = 0; while (a < GALAXY_ARMS - 1 && u >= GALAXY_ARM_W[a]) { u -= GALAXY_ARM_W[a]; a++; } return a; };
  const warm = () => [0, 7, 1, 7][Math.floor(rnd() * 4)];
  const sphere = r => { const u = rnd() * 2 - 1, th = rnd() * TAU, q = Math.sqrt(1 - u * u); return [Math.cos(th) * q * r, u * r, Math.sin(th) * q * r]; };
  const armStar = (r, a, wide) => {   // a point on arm a at radius r; wide: width factor; returns the lateral offset in widths
    const s = (0.11 + 0.06 * r) * (a % 2 ? 0.8 : 1) * wide, off = g(), th = galaxyArmAngle(a, r) + off * s;
    x = Math.cos(th) * r; z = Math.sin(th) * r; y = clamp(g() * 0.025 * (1.2 - 0.6 * r), -0.08, 0.08);
    return off;
  };
  const knotStar = (c, spread) => { x = c.x + g() * c.s * spread; z = c.z + g() * c.s * spread; y = c.y + g() * c.s * 0.5; };
  let q = k;
  if (star) {   // bright cluster star in an arm, out of the bulge
    arm = armOf(); const r = 0.4 + (GALAXY_ARM_END[arm] - 0.4) * Math.pow(rnd(), 1.1);
    armStar(r, arm, 1); rigid = true;
    ci = [3, 3, 0, 2, 5, 6][Math.floor(rnd() * 6)]; sz = 1.8 + rnd() * 0.8; br = 1;
  } else if (q < GALAXY_BULGE) {   // bulge: squashed ball, yellowish white
    const r = 0.26 * Math.pow(rnd(), 1.9), p = sphere(r);
    x = p[0]; y = p[1] * 0.7; z = p[2]; ci = warm(); sz = 0.9 + rnd() * 0.8; br = 0.7 + 0.3 * (1 - r / 0.26);
  } else if ((q -= GALAXY_BULGE) < GALAXY_BARS) {   // bar: elongated, golden old stars, turns rigidly
    const along = (rnd() + rnd() - 1) * GALAXY_R0 * 1.1, ax = Math.abs(along) / (GALAXY_R0 * 1.1), across = g() * 0.045 * (1 - 0.5 * ax), c = Math.cos(GALAXY_BAR), s = Math.sin(GALAXY_BAR);
    x = along * c - across * s; z = along * s + across * c; y = g() * 0.035 * (1 - 0.5 * ax);
    ci = [1, 7, 1, 0, 7][Math.floor(rnd() * 5)]; sz = 0.9 + rnd() * 0.7; br = 0.65 + 0.35 * (1 - ax); rigid = true;
  } else if ((q -= GALAXY_BARS) < GALAXY_HALO) {   // halo: sparse, old, dim
    const p = sphere(0.4 + 0.55 * Math.pow(rnd(), 0.8));
    x = p[0]; y = p[1]; z = p[2]; ci = [1, 0, 7, 2][Math.floor(rnd() * 4)]; sz = 0.8 + rnd() * 0.6; br = 0.3 + 0.15 * rnd();
  } else if ((q -= GALAXY_HALO) < GALAXY_GLOB) {   // globular clusters: small golden knots in the halo
    knotStar(K.glob[Math.floor(rnd() * K.glob.length)], 1);

  // Home page: A opens Atlas (only when nothing else has focus)
  if ((e.key === 'a' || e.key === 'A') && current === 'today' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.target === document.body || e.target === document.documentElement)) {
    e.preventDefault(); const ab = document.querySelector('.hs-atlas'); if (ab) ab.click(); else showView('agents', { focus: true }); return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && String(e.key).toLowerCase() === 'k') { e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if (e.key === 'Escape') {
    if (!listEl.hidden) { closeResults(); return; }
    if (state.selected) { e.preventDefault(); closeDetail(); }
  }
}

// The aurora discs drift over 26 to 38 s, a few px a second. Each time they move, the browser redoes every glass surface above
// them: at 144 Hz the 95th percentile frame took 15 ms with the discs moving and 8 ms with them still. Ten steps a second look the
// same (under a px each, on a soft disc), so each drift animation is paused when it starts and moved on by a timer. The CSS keeps
// the curve; leaving the home page cancels the animation and coming back starts a new one, which is caught the same way.
function driftAurora() {
  const bg = document.querySelector('.bg'), live = new Set();
  if (!bg) return;
  let id = 0, last = 0;
  const step = () => {
    const now = performance.now(), dt = now - last;
    last = now;
    for (const a of live) {
      if (a.playState === 'idle') live.delete(a);   // cancelled (another view or reduced motion)
      else a.currentTime += dt;
    }
    if (!live.size) { clearInterval(id); id = 0; }
  };
  bg.addEventListener('animationstart', e => {
    if (e.target.tagName !== 'I') return;   // a shooting star runs at full rate
    const a = e.target.getAnimations().find(x => x.animationName === e.animationName);
    if (!a || live.has(a)) return;
    a.pause(); live.add(a);
    if (!id) { last = performance.now(); id = setInterval(step, 100); }
  });
}

function init() {
  // Theme first (even if the data is broken)
  const initialTheme = store.get('theme') || document.documentElement.getAttribute('data-theme') || 'dark';
  applyTint(store.get('tint') || 'blue');
  applyLook(lookParse(store.get('look')), false);
  applyTheme(initialTheme);
  LG.init();
  driftAurora();
  $('#theme').addEventListener('click', () => applyTheme({ auto: 'light', light: 'dark', dark: 'auto' }[state.theme]));
  DARK.addEventListener('change', () => { if (state.theme === 'auto') { readPalette(); bus.emit('theme'); } });

  try {
    G = normalize(readEmbedded());
  } catch (e) {
    metaEl.textContent = 'no data';
    $('#q').disabled = true;
    mainEl.replaceChildren(errorCard('Data could not be loaded', e));
    return;
  }
  try { const a = JSON.parse(store.get('areas') || '[]'); if (Array.isArray(a)) state.areas = new Set(a.filter(k => AREA_BY_KEY.has(k))); } catch (e) { /* ignore */ }
  computeEmphasis();
  renderMeta();
  initTabs();
  initSearch();
  document.addEventListener('keydown', globalKeys);
  document.addEventListener('input', e => { if (e.target.matches && e.target.matches('.hs-glass-range, .os-range')) rangeFill(e.target); }, true);
  window.addEventListener('scroll', hideTip, { passive: true });
  window.addEventListener('resize', moveInd);
  window.addEventListener('resize', () => { if (LOOK.backdrop !== 'quiet') { clearTimeout(BACKDROP.t); BACKDROP.t = setTimeout(syncBackdrop, 200); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  showView(viewFromHash() || store.get('view') || 'today');

  setInterval(renderMeta, 30000);
  if (G.api) {
    const btn = $('#refresh');
    btn.hidden = false;
    btn.addEventListener('click', () => refreshData(true));
    setInterval(() => { if (!document.hidden) refreshData(false); }, 60000);
  }
}
init();
})();
