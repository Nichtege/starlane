name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4   # a few tests run the dashboard's pure functions under Node
        with:
          node-version: "20"
      - name: Run the test suite
        run: python -m unittest discover -s tests -t .

  install:
    name: clean pip install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a fresh virtual environment (no warnings allowed)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --disable-pip-version-check . 2>&1 | tee "$RUNNER_TEMP/pip.log"
          if grep -iE "deprecat|warning" "$RUNNER_TEMP/pip.log"; then echo "pip printed warnings"; exit 1; fi
      - name: First run from an unrelated folder
        run: |
          export AOS_HOME="$RUNNER_TEMP/aos-home"
          cd "$RUNNER_TEMP"
          "$PY" -m aos --version
          "$PY" -m aos setup
          "$PY" -m aos doctor
          "$PY" -m aos digest
          "$PY" -m aos mapcheck --strict
          "$PY" -m aos agents
          "$PY" -m aos next --prompt
